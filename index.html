<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connect 4 vs AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header class="masthead">
      <h1>Connect 4 vs AI</h1>
      <p class="lede">Get four in a row vs AI</p>
    </header>

    <section class="play" aria-label="Game">
      <div class="game-grid">
        <div class="win-label" aria-hidden="true"><span>Win</span><span>chance<span class="eval-spinner" id="eval-spinner" hidden></span></span></div>
        <p class="ai-count" id="ai-count" aria-live="polite"></p>
        <div class="eval" id="eval" role="img" aria-label="Win chance">
          <div class="eval-ai" id="eval-ai"></div>
          <div class="eval-draw" id="eval-draw"></div>
          <div class="eval-you" id="eval-you"></div>
          <div class="eval-mid"></div>
          <span class="eval-top" id="eval-top"></span>
          <span class="eval-bottom" id="eval-bottom"></span>
        </div>
        <div class="board-wrap">
          <div class="board" id="board" role="group" aria-label="Board, 7 columns. Press 1 to 7 to drop a stone."></div>
          <button type="button" class="start" id="start" aria-label="Start game">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg>
          </button>
        </div>
      </div>
      <div class="turn" id="turn">
        <span class="turn-stone"></span>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </div>

      <fieldset class="segmented level">
        <legend>Difficulty</legend>
        <label><input type="radio" name="level" value="easy"> Easy</label>
        <label><input type="radio" name="level" value="medium" checked> Medium</label>
        <label title="Perfect from the middle game on. The opening is still being improved."><input type="radio" name="level" value="unbeatable"> Unbeatable</label>
      </fieldset>
      <div class="controls">
        <fieldset class="segmented first">
          <legend>Who moves first</legend>
          <label><input type="radio" name="first" value="ai" checked> AI</label>
          <label><input type="radio" name="first" value="human"> You</label>
        </fieldset>
        <button type="button" id="undo">Undo</button>
        <button type="button" id="new" class="primary">New game</button>
      </div>
    </section>
  </main>

  <div class="result" id="result" hidden>
    <div class="rain" id="rain" aria-hidden="true"></div>
    <div class="result-ring" aria-hidden="true"></div>
    <div class="big-stone" role="dialog" aria-modal="true" aria-labelledby="result-title">
      <p class="result-title" id="result-title"></p>
      <button type="button" class="again" id="again">Play again</button>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
