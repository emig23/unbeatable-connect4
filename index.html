<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connect 4 vs AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header class="masthead">
      <h1>Connect 4 vs AI</h1>
      <p class="lede">Get four in a row vs AI</p>
    </header>

    <section class="play" aria-label="Game">
      <div class="board" id="board" role="group" aria-label="Board, 7 columns. Press 1 to 7 to drop a stone."></div>
      <p class="status" id="status" role="status" aria-live="polite"></p>

      <fieldset class="segmented level">
        <legend>Difficulty</legend>
        <label><input type="radio" name="level" value="easy"> Easy</label>
        <label><input type="radio" name="level" value="medium" checked> Medium</label>
        <label title="Coming soon"><input type="radio" name="level" value="unbeatable" disabled> Unbeatable <span class="soon">#TODO</span></label>
      </fieldset>
      <div class="controls">
        <fieldset class="segmented first">
          <legend>Who moves first</legend>
          <label><input type="radio" name="first" value="ai" checked> AI</label>
          <label><input type="radio" name="first" value="human"> You</label>
        </fieldset>
        <button type="button" id="undo">Undo</button>
        <button type="button" id="new" class="primary">New game</button>
      </div>
    </section>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
